name: Merge changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: false
        default: 'auto'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-pr:
    runs-on: ubuntu-latest
    name: Generate release PR

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - id: run
      run: |
        changie batch ${{ inputs.version }}
        changie merge
        echo "latest=$(changie latest)" >> "$GITHUB_OUTPUT"

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
      with:
        title: Release ${{ steps.run.outputs.latest }}
        branch: release/${{ steps.run.outputs.latest }}
        commit-message: Release ${{ steps.run.outputs.latest }}
        token: ${{ secrets.GITHUB_TOKEN }}
