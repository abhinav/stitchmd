name: Merge changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: false
        default: 'auto'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-pr:
    runs-on: ubuntu-latest
    name: Generate release PR

    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - id: run
      run: |
        changie batch ${{ inputs.version }}
        changie merge
        echo "latest=$(changie latest)" >> "$GITHUB_OUTPUT"

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
      with:
        title: Release ${{ steps.run.outputs.latest }}
        branch: release/${{ steps.run.outputs.latest }}
        commit-message: Release ${{ steps.run.outputs.latest }}
        token: ${{ secrets.GITHUB_TOKEN }}
